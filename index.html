<!doctype html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#f2f1e7;--muted:#a9b5b0;--gold:#ffd278;--blue:#77a8ff;--panel:#19272a;--line:#344447}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#28413e 0%,#142326 47%,#0d171a 100%);color:var(--ink);font:500 14px 'DM Sans',sans-serif;display:flex;justify-content:center;align-items:flex-start;padding:20px 14px 28px}.shell{width:min(1120px,100%)}.topbar{display:flex;justify-content:space-between;align-items:center;margin:0 auto 13px;gap:12px}.brand{display:flex;align-items:center;gap:11px}.crest{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#f7d77e,#d98d49);display:grid;place-items:center;color:#573c28;font-size:23px;box-shadow:0 6px 20px #0005}.brand h1{font:800 21px 'Outfit',sans-serif;letter-spacing:.02em;margin:0}.brand p{margin:1px 0 0;color:#9daea7;font-size:11px;letter-spacing:.12em;text-transform:uppercase}.top-actions{display:flex;gap:8px}.btn{border:1px solid #405352;background:#1a2a2c;color:#e3e7d9;padding:9px 13px;border-radius:10px;font:700 12px 'DM Sans';cursor:pointer;transition:.18s}.btn:hover{border-color:#9cbe9b;background:#253938;transform:translateY(-1px)}.arena-frame{background:#121e20;border:1px solid #51615a;border-radius:18px;padding:8px;box-shadow:0 24px 70px #0007;position:relative;overflow:hidden}.canvas-wrap{position:relative;width:100%;aspect-ratio:1000/550;border-radius:11px;overflow:hidden;background:#5d8a61}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;inset:15px 16px auto;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.side-hud{width:31%;display:flex;align-items:center;gap:8px}.side-hud.enemy{flex-direction:row-reverse;text-align:right}.avatar{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:17px;border:1px solid #ffffff50;background:#bb4c4a}.avatar.you{background:#3971ca}.tower-meta{min-width:0;flex:1}.tower-name{font:800 10px 'Outfit';letter-spacing:.1em;color:#fff;text-shadow:0 1px 4px #000;white-space:nowrap}.hp-track{height:7px;margin-top:4px;border:1px solid #14201cb0;background:#14201cd9;border-radius:9px;overflow:hidden}.hp-fill{height:100%;width:100%;background:linear-gradient(90deg,#61d078,#a4e782);border-radius:8px;transition:width .25s}.enemy .hp-fill{background:linear-gradient(90deg,#e9785c,#ffc269)}.hp-label{font-size:10px;color:#f8edcf;text-shadow:0 1px 3px #000;font-weight:800;margin-top:2px}.timer{background:#19272add;border:1px solid #ffffff55;box-shadow:0 3px 12px #0004;border-radius:12px;padding:6px 12px;text-align:center;min-width:66px}.timer b{display:block;font:800 18px 'Outfit';line-height:1}.timer span{font-size:9px;letter-spacing:.12em;color:#c3d0c4}.under{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:11px 5px 0}.energy-box{min-width:0}.energy-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.energy-title{font:800 11px 'Outfit';letter-spacing:.11em;color:#d4cbff}.energy-value{font:800 13px 'Outfit';color:#e8dbff}.energy-track{height:10px;border-radius:8px;background:#111a21;border:1px solid #46505e;overflow:hidden;box-shadow:inset 0 2px 3px #0008}.energy-fill{height:100%;width:50%;background:linear-gradient(90deg,#7664de,#bd94ff);border-radius:8px;transition:width .2s}.status{color:#aab8ad;font-size:11px;min-width:160px;text-align:right}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:11px}.card{--accent:#69a4ed;position:relative;display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:9px;text-align:left;min-width:0;border:1px solid #435355;border-radius:13px;padding:8px 10px;background:linear-gradient(145deg,#263638,#1b292b);color:var(--ink);cursor:pointer;transition:transform .16s,border-color .16s,background .16s;box-shadow:0 5px 12px #0003}.card:hover:not(:disabled){transform:translateY(-3px);border-color:var(--accent)}.card.selected{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 45%,transparent),0 6px 16px #0005;background:linear-gradient(145deg,#354747,#223235)}.card:disabled{opacity:.48;cursor:not-allowed;filter:saturate(.6)}.card-icon{width:40px;height:42px;border-radius:11px;background:color-mix(in srgb,var(--accent) 25%,#182325);display:grid;place-items:center;font-size:25px;border:1px solid color-mix(in srgb,var(--accent) 55%,transparent)}.card-name{display:block;font:800 13px 'Outfit';white-space:nowrap}.card-desc{display:block;color:#9eafaa;font-size:10px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cost{align-self:start;display:flex;align-items:center;gap:3px;color:#e5d9ff;font:800 13px 'Outfit'}.cost:before{content:'✦';color:#b6a3ff;font-size:12px}.hint{text-align:center;color:#71827e;font-size:10px;margin:9px 0 0}.overlay{position:absolute;inset:0;background:#101b20b8;backdrop-filter:blur(4px);display:grid;place-items:center;z-index:3;opacity:0;pointer-events:none;transition:opacity .25s}.overlay.show{opacity:1;pointer-events:auto}.result{width:min(370px,90%);border:1px solid #687c6a;background:linear-gradient(145deg,#263a39,#172526);border-radius:20px;padding:25px;text-align:center;box-shadow:0 20px 60px #0009}.result .medal{font-size:42px}.result h2{font:900 28px 'Outfit';margin:7px 0}.result p{color:#b8c5bb;margin:0 0 17px}.toast{position:absolute;z-index:2;left:50%;top:70px;transform:translate(-50%,-8px);padding:8px 13px;border-radius:99px;background:#12201ee8;border:1px solid #ffffff38;color:#fff1ca;font-size:12px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:680px){body{padding:10px 8px 18px}.topbar{margin-bottom:8px}.brand h1{font-size:17px}.brand p{font-size:9px}.crest{width:36px;height:36px}.btn{padding:8px 9px;font-size:11px}.arena-frame{padding:5px;border-radius:13px}.canvas-wrap{border-radius:9px}.hud{inset:8px 8px auto}.avatar{width:26px;height:26px;font-size:13px;border-radius:8px}.side-hud{gap:5px;width:34%}.tower-name{font-size:8px}.hp-track{height:5px;margin-top:3px}.hp-label{font-size:8px;margin-top:1px}.timer{min-width:51px;padding:4px 7px;border-radius:9px}.timer b{font-size:14px}.timer span{font-size:7px}.under{padding:8px 2px 0;gap:6px}.status{min-width:92px;font-size:9px}.energy-title{font-size:9px}.energy-value{font-size:11px}.energy-track{height:8px}.cards{gap:5px;margin-top:8px}.card{grid-template-columns:1fr;justify-items:center;gap:3px;padding:5px 3px 7px;border-radius:10px}.card-icon{width:31px;height:30px;font-size:20px;border-radius:8px}.card-name{font-size:10px}.card-desc{display:none}.cost{position:absolute;right:5px;top:4px;font-size:10px}.hint{font-size:9px;margin-top:7px}}@media(max-width:370px){.status{min-width:78px}.brand p{letter-spacing:.05em}.btn{padding:7px}}
</style>
</head>
<body><main class="shell">
<header class="topbar"><div class="brand"><div class="crest">♛</div><div><h1>CROWN & CURRENT</h1><p>Riverlands · Crownfall Arena</p></div></div><div class="top-actions"><button class="btn" id="soundBtn" aria-label="Toggle sound">♪ Sound: Off</button><button class="btn" id="resetBtn">↻ Restart</button></div></header>
<section class="arena-frame"><div class="canvas-wrap"><canvas id="arena" width="1000" height="550" aria-label="Battle arena. Select a card then tap your side of the arena to deploy."></canvas><div class="hud"><div class="side-hud"><div class="avatar">♜</div><div class="tower-meta"><div class="tower-name">RIVAL CROWN</div><div class="hp-track"><div class="hp-fill" id="enemyHp"></div></div><div class="hp-label" id="enemyHpText">1200 / 1200</div></div></div><div class="timer"><b id="clock">1:30</b><span>REMAINING</span></div><div class="side-hud enemy"><div class="avatar you">♛</div><div class="tower-meta"><div class="tower-name">YOUR CROWN</div><div class="hp-track"><div class="hp-fill" id="playerHp"></div></div><div class="hp-label" id="playerHpText">1200 / 1200</div></div></div></div><div class="toast" id="toast"></div><div class="overlay" id="overlay"><div class="result"><div class="medal" id="medal">🏆</div><h2 id="resultTitle">Victory!</h2><p id="resultText">The crown is yours.</p><button class="btn" id="againBtn">Play again</button></div></div></div></section>
<div class="under"><div class="energy-box"><div class="energy-top"><div class="energy-title">✦ MANA</div><div class="energy-value"><span id="energyText">5.0</span> / 10</div></div><div class="energy-track"><div class="energy-fill" id="energyFill"></div></div></div><div class="status" id="status">Choose a card to deploy</div></div>
<div class="cards" id="cards"></div><p class="hint">Select a card, then tap your half of the arena · Destroy the rival crown before time runs out</p>
</main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('arena'),ctx=canvas.getContext('2d'),W=1000,H=550,MID=275,$=id=>document.getElementById(id);
const defs=[
{id:'knight',name:'Knight',icon:'🛡️',cost:3,desc:'Steady frontline fighter',hp:190,damage:34,speed:44,range:25,rate:.82,radius:14,color:'#6e9df1',role:'unit'},
{id:'archers',name:'Archers',icon:'🏹',cost:3,desc:'Two nimble ranged units',hp:76,damage:18,speed:38,range:116,rate:.95,radius:10,color:'#6bc1aa',role:'archers'},
{id:'giant',name:'Giant',icon:'🪨',cost:5,desc:'Slow, devastating bruiser',hp:510,damage:82,speed:23,range:28,rate:1.55,radius:21,color:'#c99b67',role:'giant'},
{id:'fireball',name:'Fireball',icon:'🔥',cost:4,desc:'Blast a group for 180 damage',damage:180,radius:74,color:'#f18b59',role:'spell'}
];
let game, last=performance.now(),toastTimer=0,sound=false,audioCtx=null;
const color=(side)=>side==='player'?'#568af0':'#e86a65';
function reset(){game={units:[],shots:[],particles:[],elapsed:0,time:90,energy:5,aiEnergy:5,selected:null,over:false,spawn:3.3,playerHp:1200,enemyHp:1200,toast:'',toastTime:0,shake:0};$('overlay').classList.remove('show');status('Choose a card to deploy');updateHud()}
function status(s){$('status').textContent=s}
function notify(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1500)}
function renderCards(){const el=$('cards');el.innerHTML='';for(const d of defs){const b=document.createElement('button');b.className='card';b.dataset.id=d.id;b.style.setProperty('--accent',d.color);b.innerHTML=`<span class="card-icon">${d.icon}</span><span><span class="card-name">${d.name}</span><span class="card-desc">${d.desc}</span></span><span class="cost">${d.cost}</span>`;b.onclick=()=>selectCard(d.id);el.append(b)}}
function selectCard(id){if(game.over)return;const d=defs.find(x=>x.id===id);if(game.energy<d.cost){notify('Not enough mana yet!');return}game.selected=game.selected===id?null:id;syncCards();status(game.selected?`Tap your side to place ${d.name}`:'Choose a card to deploy')}
function syncCards(){document.querySelectorAll('.card').forEach(b=>{const d=defs.find(x=>x.id===b.dataset.id);b.classList.toggle('selected',game.selected===d.id);b.disabled=game.over||game.energy<d.cost})}
function place(e){if(!game.selected||game.over)return;const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*W/rect.width,y=(e.clientY-rect.top)*H/rect.height,d=defs.find(z=>z.id===game.selected);if(d.role!=='spell'&&y<MID+12){notify('Troops must be deployed on your side');return}if(d.role==='spell'&&y>MID+20){notify('Fireball can only target the rival side');return}if(d.role!=='spell'&&(x<205||x>795)){notify('Deploy between the river paths');return}if(game.energy<d.cost){notify('Not enough mana yet!');return}game.energy-=d.cost;if(d.role==='spell')castSpell(x,y,'player');else spawnUnit(d,'player',Math.max(250,Math.min(750,x)),Math.max(320,Math.min(505,y)));game.selected=null;syncCards();status('Your troops are marching!');playTone(470,.06)}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture?.(e.pointerId);place(e)});
$('resetBtn').onclick=reset;$('againBtn').onclick=reset;$('soundBtn').onclick=()=>{sound=!sound;$('soundBtn').textContent=`♪ Sound: ${sound?'On':'Off'}`;if(sound)playTone(520,.1)};
function playTone(freq,dur){if(!sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),gain=audioCtx.createGain();o.frequency.value=freq;o.type='sine';gain.gain.setValueAtTime(.05,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(gain);gain.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch{}}
function spawnUnit(d,side,x,y){const n=d.role==='archers'?2:1;for(let i=0;i<n;i++){const offset=n===2?(i?12:-12):0,dir=side==='player'?-1:1;game.units.push({id:Math.random(),kind:d.id,side,x:x+offset,y:y+(i?4:0),hp:d.hp,maxHp:d.hp,damage:d.damage,speed:d.speed,range:d.range,rate:d.rate,attack:Math.random()*.4,radius:d.radius,walk:Math.random()*7,flash:0,target:null})}burst(x,y,color(side),8)}
function castSpell(x,y,side){const foe=side==='player'?'enemy':'player';let hits=0;for(const u of game.units){if(u.side!==foe&&Math.hypot(u.x-x,u.y-y)<75){u.hp-=180;u.flash=.18;hits++}}if(side==='player'&&Math.abs(x-500)<95&&y<130){game.enemyHp-=180;hits++}if(side==='enemy'&&Math.abs(x-500)<95&&y>420){game.playerHp-=180;hits++}burst(x,y,'#ffb55e',30);game.shots.push({x,y,x2:x,y2:y,life:.45,side});game.shake=.18;notify(hits?`Fireball hit ${hits} target${hits===1?'':'s'}!`:'Fireball!');playTone(150,.22)}
function spawnAI(){const possible=defs.filter(d=>d.role!=='spell'&&d.cost<=game.aiEnergy);if(!possible.length)return;const d=possible[Math.random()<.54?0:Math.floor(Math.random()*possible.length)];if(game.aiEnergy>=d.cost){game.aiEnergy-=d.cost;const x=Math.random()<.5?350:650;spawnUnit(d,'enemy',x,45+Math.random()*95)}}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=20+Math.random()*100;game.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.55,max:.9,size:2+Math.random()*4,color:c})}}
function update(dt){if(!game||game.over)return;game.elapsed+=dt;game.time=Math.max(0,90-game.elapsed);game.energy=Math.min(10,game.energy+dt*.48);game.aiEnergy=Math.min(10,game.aiEnergy+dt*.48);game.spawn-=dt;if(game.spawn<=0){spawnAI();game.spawn=2.8+Math.random()*2.2}const direction={player:-1,enemy:1};
for(const u of game.units){u.walk+=dt*8;u.flash=Math.max(0,u.flash-dt);u.attack-=dt;const foes=game.units.filter(v=>v.side!==u.side&&v.hp>0);let target=null,min=Infinity;for(const v of foes){const dx=v.x-u.x,dy=v.y-u.y;if(Math.abs(dx)<43&&dy*direction[u.side]>-4&&Math.abs(dy)<u.range+v.radius+4){const dis=Math.hypot(dx,dy);if(dis<min){min=dis;target=v}}}
if(target){if(u.attack<=0){target.hp-=u.damage;target.flash=.12;u.attack=u.rate;game.shots.push({x:u.x,y:u.y,x2:target.x,y2:target.y,life:.13,side:u.side});if(target.hp<=0)burst(target.x,target.y,color(target.side),7)}}else{const towerY=u.side==='player'?70:480,towerHpKey=u.side==='player'?'enemyHp':'playerHp',toTower= Math.abs(towerY-u.y);if(toTower<=u.range+30){if(u.attack<=0){game[towerHpKey]=Math.max(0,game[towerHpKey]-u.damage);u.attack=u.rate;game.shots.push({x:u.x,y:u.y,x2:500,y2:towerY,life:.13,side:u.side});game.shake=.05}}else{let destX=500;if(u.x<430)destX=350;else if(u.x>570)destX=650;const dx=destX-u.x;u.x+=Math.sign(dx)*Math.min(Math.abs(dx),u.speed*dt*.65);u.y+=direction[u.side]*u.speed*dt;if(u.side==='player'&&u.y<302)u.y=Math.max(u.y,302);if(u.side==='enemy'&&u.y>248)u.y=Math.min(u.y,248)}}}
game.units=game.units.filter(u=>u.hp>0);game.shots=game.shots.filter(s=>(s.life-=dt)>0);for(const p of game.particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96}game.particles=game.particles.filter(p=>p.life>0);game.shake=Math.max(0,game.shake-dt);if(game.playerHp<=0)endGame('lose');else if(game.enemyHp<=0)endGame('win');else if(game.time<=0)endGame(game.playerHp>=game.enemyHp?'win':'lose');updateHud()}
function updateHud(){const p=Math.max(0,game.playerHp),e=Math.max(0,game.enemyHp);$('playerHp').style.width=`${p/12}%`;$('enemyHp').style.width=`${e/12}%`;$('playerHpText').textContent=`${Math.ceil(p)} / 1200`;$('enemyHpText').textContent=`${Math.ceil(e)} / 1200`;$('energyText').textContent=game.energy.toFixed(1);$('energyFill').style.width=`${game.energy*10}%`;const secs=Math.ceil(game.time);$('clock').textContent=`${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`;syncCards()}
function endGame(outcome){if(game.over)return;game.over=true;game.selected=null;syncCards();const win=outcome==='win';$('medal').textContent=win?'🏆':'🛡️';$('resultTitle').textContent=win?'Crown secured!':'The river is lost';$('resultText').textContent=win?'The rival crown has fallen. Your realm celebrates!':'Your crown held no longer. Rally your troops and try again.';$('overlay').classList.add('show');playTone(win?680:180,.4)}
function roundRect(g,x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}
function drawArena(){const g=ctx;g.clearRect(0,0,W,H);g.fillStyle='#648f65';g.fillRect(0,0,W,H);for(let y=0;y<H;y+=44)for(let x=0;x<W;x+=48){g.fillStyle=((x/48+y/44)%2?'#ffffff08':'#183f2924');g.fillRect(x+((y/44)%2)*24,y,24,22)}
// soft terrain borders and leafy edge stones
g.fillStyle='#3b724b';g.fillRect(0,0,84,H);g.fillRect(916,0,84,H);for(let i=0;i<42;i++){for(const x of [30,970]){const y=(i*67+18)%H;g.fillStyle=i%3?'#285b3c':'#80a864';g.beginPath();g.arc(x+(i%2?7:-5),y,5+(i%4)*1.6,0,Math.PI*2);g.fill();g.globalAlpha=.5;g.fillStyle='#c2cc86';g.beginPath();g.arc(x+(i%2?5:-7),y-2,2,0,Math.PI*2);g.fill();g.globalAlpha=1}}
// river with two wooden crossings
g.fillStyle='#c5b276';g.fillRect(84,245,832,60);g.fillStyle='#408f9e';g.fillRect(84,251,832,48);g.fillStyle='#66b8be';g.fillRect(84,251,832,5);for(let i=0;i<15;i++){const x=(i*89+game.elapsed*25)%850+85,y=260+(i*19)%28;g.strokeStyle='#c6eef055';g.lineWidth=2;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+10,y-2,x+19,y);g.stroke()}
for(const [bx,bw] of [[292,132],[576,132]]){g.fillStyle='#725641';g.fillRect(bx-5,238,bw+10,74);g.fillStyle='#a68159';g.fillRect(bx,243,bw,64);for(let x=bx+7;x<bx+bw;x+=22){g.fillStyle='#bb9366';g.fillRect(x,244,4,61);g.strokeStyle='#806244';g.lineWidth=1;g.beginPath();g.moveTo(x,245);g.lineTo(x+2,303);g.stroke()}g.fillStyle='#5e4939';g.fillRect(bx-7,239,bw+14,6);g.fillRect(bx-7,305,bw+14,6)}
// lane markings / field glints
g.fillStyle='#dfca951f';g.fillRect(292,14,132,224);g.fillRect(576,14,132,224);g.fillRect(292,312,132,224);g.fillRect(576,312,132,224);for(let i=0;i<21;i++){const x=112+(i*197)%780,y=35+(i*137)%480;if(y>230&&y<315)continue;g.globalAlpha=.55;g.fillStyle=i%2?'#e7d079':'#e5e9c2';g.beginPath();g.arc(x,y,1.7+(i%3)*.5,0,Math.PI*2);g.fill();g.globalAlpha=1}
drawTower(500,70,'enemy',game.enemyHp/1200);drawTower(500,480,'player',game.playerHp/1200)}
function drawTower(x,y,side,hp){const g=ctx,enemy=side==='enemy',main=enemy?'#d85e5a':'#467ce0',dark=enemy?'#9e4248':'#3157a9',edge=enemy?'#6c3437':'#243d72';g.save();g.translate(x,y);g.fillStyle='#16232455';g.beginPath();g.ellipse(0,27,48,15,0,0,Math.PI*2);g.fill();g.fillStyle='#b7a283';roundRect(g,-37,-20,74,49,9);g.fill();g.fillStyle=dark;roundRect(g,-32,-17,64,43,7);g.fill();g.fillStyle=main;roundRect(g,-28,-14,56,35,6);g.fill();g.fillStyle=edge;g.fillRect(-32,-18,64,9);for(let dx=-27;dx<=23;dx+=17){g.fillStyle=enemy?'#ee8a72':'#78aaff';roundRect(g,dx,-23,10,15,3);g.fill()}g.fillStyle=enemy?'#ffbf6b':'#ffe276';g.beginPath();g.moveTo(0,-54);g.lineTo(10,-39);g.lineTo(7,-24);g.lineTo(-7,-24);g.lineTo(-10,-39);g.closePath();g.fill();g.fillStyle='#fff5bd';g.beginPath();g.arc(0,-39,4,0,Math.PI*2);g.fill();g.fillStyle='#14201e';roundRect(g,-24,34,48,7,4);g.fill();g.fillStyle=hp>.45?'#71d27c':'#f1a84e';roundRect(g,-22,35,44*Math.max(0,hp),5,3);g.fill();g.fillStyle='#fff';g.font='800 10px Outfit,sans-serif';g.textAlign='center';g.fillText(enemy?'RIVAL':'YOUR CROWN',0,57);g.restore()}
function drawUnit(u){const g=ctx;g.save();g.translate(u.x,u.y+Math.sin(u.walk)*1.5);const enemy=u.side==='enemy',accent=color(u.side);g.fillStyle='#17211e55';g.beginPath();g.ellipse(0,u.radius*.78,u.radius*1.25,5,0,0,Math.PI*2);g.fill();g.strokeStyle=enemy?'#ffc2a3':'#d7e3ff';g.lineWidth=2.5;g.lineCap='round';g.beginPath();g.moveTo(-5,u.radius*.25);g.lineTo(-7+Math.sin(u.walk)*3,u.radius*.72);g.moveTo(5,u.radius*.25);g.lineTo(7-Math.sin(u.walk)*3,u.radius*.72);g.stroke();let body=accent,head='#f0bd8e';if(u.kind==='knight'){body=enemy?'#c45357':'#416dc6';head=enemy?'#edb08b':'#d69d79'}if(u.kind==='archers')body=enemy?'#a34f85':'#318f80';if(u.kind==='giant')body=enemy?'#994b48':'#756044';g.fillStyle=u.flash>0?'#fff':body;g.beginPath();g.ellipse(0,0,u.radius*.86,u.radius*1.02,0,0,Math.PI*2);g.fill();g.strokeStyle='#ffffff80';g.lineWidth=1.5;g.stroke();g.fillStyle=head;g.beginPath();g.arc(0,-u.radius*.52,u.radius*.46,0,Math.PI*2);g.fill();if(u.kind==='knight'){g.fillStyle=enemy?'#f0a04f':'#a9c8eb';g.beginPath();g.arc(0,-u.radius*.61,u.radius*.48,Math.PI,0);g.lineTo(u.radius*.45,-u.radius*.38);g.lineTo(-u.radius*.45,-u.radius*.38);g.fill();g.fillStyle='#fff7d4';g.fillRect(-3,-u.radius*.59,6,2)}if(u.kind==='archers'){g.fillStyle=enemy?'#a7497b':'#267668';g.beginPath();g.arc(0,-u.radius*.55,u.radius*.52,Math.PI,Math.PI*2);g.lineTo(u.radius*.48,-u.radius*.24);g.lineTo(-u.radius*.48,-u.radius*.24);g.fill();g.strokeStyle='#f6d79a';g.lineWidth=2;g.beginPath();g.arc(u.radius*.68,0,7,-1.2,1.2);g.stroke()}if(u.kind==='giant'){g.fillStyle='#887058';g.beginPath();g.arc(0,-u.radius*.55,u.radius*.58,Math.PI,Math.PI*2);g.fill();g.fillStyle='#ffde81';g.fillRect(-7,-u.radius*.57,3,3);g.fillRect(4,-u.radius*.57,3,3)}g.fillStyle=accent;g.beginPath();g.arc(0,u.radius*.96,4,0,Math.PI*2);g.fill();g.fillStyle='#172324';roundRect(g,-u.radius,-u.radius-11,u.radius*2,4,2);g.fill();g.fillStyle=u.hp/u.maxHp>.35?'#8be08b':'#ffb25f';roundRect(g,-u.radius,-u.radius-11,u.radius*2*Math.max(0,u.hp/u.maxHp),4,2);g.fill();g.restore()}
function draw(){const g=ctx;g.save();if(game.shake)g.translate((Math.random()-.5)*game.shake*24,(Math.random()-.5)*game.shake*24);drawArena();for(const u of game.units)drawUnit(u);for(const s of game.shots){g.globalAlpha=Math.max(0,s.life/.13);g.strokeStyle=s.side==='player'?'#d6eeff':'#ffd4c0';g.lineWidth=2.5;g.beginPath();g.moveTo(s.x,s.y);g.lineTo(s.x2,s.y2);g.stroke();g.globalAlpha=1}for(const p of game.particles){g.globalAlpha=Math.max(0,p.life/p.max);g.fillStyle=p.color;g.beginPath();g.arc(p.x,p.y,p.size*Math.max(.2,p.life/p.max),0,Math.PI*2);g.fill()}g.globalAlpha=1;if(game.selected&&!game.over){const c=defs.find(a=>a.id===game.selected);g.globalAlpha=.13;g.fillStyle=c.role==='spell'?'#f17854':'#5f91ff';g.fillRect(84,c.role==='spell'?0:MID+4,832,c.role==='spell'?MID-4:H-MID-4);g.globalAlpha=.85;g.strokeStyle=c.role==='spell'?'#ffb66c':'#d4e5ff';g.setLineDash([6,7]);g.lineWidth=2;g.beginPath();g.moveTo(90,MID);g.lineTo(910,MID);g.stroke();g.setLineDash([]);g.globalAlpha=1}g.restore()}
function frame(now){const dt=Math.min(.04,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(frame)}
renderCards();reset();notify('Pick a card and defend your crown!');requestAnimationFrame(frame);
})();
